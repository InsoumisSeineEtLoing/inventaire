<!DOCTYPE html>
<html lang="fr">
<head>
<!-- Favicon classique pour les onglets PC & mobile -->
<link rel="icon" type="image/png" sizes="32x32" href="app-icon.png">

<!-- Icône pour l'écran d'accueil iPhone / iPad (iOS) -->
<link rel="apple-touch-icon" sizes="180x180" href="app-icon.png">

<!-- Couleur de la barre d'adresse sur mobile (assortie au violet) -->
<meta name="theme-color" content="#6b00bd">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matos Militant - Gestion d'équipe & Inventaire</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        .modal-bg { background-color: rgba(15, 23, 42, 0.65); backdrop-filter: blur(4px); }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-16">

    <!-- HEADER TOP -->
    <header class="bg-[#0f172a] text-white py-4 px-4 sm:px-8 shadow-md">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-pink-600 p-2.5 rounded-xl flex items-center justify-center text-white shadow-lg">
                    <i class="fa-solid fa-users-gear text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">Matos Militant</h1>
                    <p class="text-xs text-slate-400">Qui a quoi ? & Gestion d'équipe</p>
                </div>
            </div>

            <div class="flex items-center gap-2 sm:gap-3 flex-wrap">
                <button onclick="openMilitantModal()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs sm:text-sm text-slate-200 px-3 py-2 rounded-lg font-medium transition flex items-center gap-2">
                    <i class="fa-solid fa-user-plus text-pink-400"></i> Militants (<span id="militants-count">0</span>)
                </button>
                <button onclick="exportData()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs sm:text-sm text-slate-200 p-2 sm:px-3 sm:py-2 rounded-lg font-medium transition" title="Télécharger sauvegarde">
                    <i class="fa-solid fa-download"></i>
                </button>
                <button onclick="openCategoryModal()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs sm:text-sm text-slate-200 p-2 sm:px-3 sm:py-2 rounded-lg font-medium transition" title="Gérer les types de matériel">
                    <i class="fa-solid fa-tags"></i>
                </button>
                <button onclick="openItemModal()" class="bg-pink-600 hover:bg-pink-700 text-white text-xs sm:text-sm px-4 py-2 rounded-lg font-semibold shadow-md transition flex items-center gap-2">
                    <i class="fa-solid fa-circle-plus"></i> Attribuer
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-8 pt-6">

        <!-- COMPTEURS HORIZONTAUX -->
        <div id="stats-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-7 gap-3 mb-6">
            <!-- Injecté en JS -->
        </div>

        <!-- BARRE DE RECHERCHE ET ONGLETS -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
            
            <div class="flex bg-slate-100 p-1 rounded-lg w-full md:w-auto">
                <button id="btn-view-militant" onclick="switchView('militant')" class="flex-1 md:flex-none px-4 py-2 rounded-md text-xs sm:text-sm font-semibold transition bg-white text-slate-900 shadow-sm flex items-center justify-center gap-2">
                    <i class="fa-solid fa-user-group text-slate-500"></i> Vue par Militant
                </button>
                <button id="btn-view-material" onclick="switchView('material')" class="flex-1 md:flex-none px-4 py-2 rounded-md text-xs sm:text-sm font-semibold transition text-slate-600 hover:text-slate-900 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-boxes-stacked text-slate-500"></i> Vue par Matériel
                </button>
            </div>

            <div class="flex flex-1 items-center gap-2 w-full md:w-auto max-w-xl">
                <div class="relative flex-1">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" id="search-input" oninput="renderApp()" placeholder="Rechercher un militant, téléphone, matériel..." class="w-full pl-9 pr-4 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-500 focus:bg-white transition">
                </div>
                <select id="filter-category" onchange="renderApp()" class="py-2 px-3 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-500 text-slate-700">
                    <option value="">Toutes les catégories</option>
                </select>
            </div>
        </div>

        <!-- CONTENU VUES -->
        <div id="militant-view" class="space-y-6"></div>
        <div id="material-view" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 hidden"></div>

    </main>

    <!-- MODAL MILITANT -->
    <div id="modal-militant" class="fixed inset-0 modal-bg z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100 relative">
            <h3 id="modal-militant-title" class="text-lg font-bold text-slate-900 mb-4">Ajouter un militant</h3>
            <form onsubmit="handleSaveMilitant(event)" class="space-y-4">
                <input type="hidden" id="militant-id">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Nom complet *</label>
                    <input type="text" id="militant-name" required placeholder="Ex: Thomas L." class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-pink-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Téléphone</label>
                    <input type="text" id="militant-phone" placeholder="Ex: 06 11 22 33 44" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-pink-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Secteur</label>
                    <input type="text" id="militant-sector" placeholder="Ex: Secteur Nord" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-pink-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Rôle</label>
                    <input type="text" id="militant-role" placeholder="Ex: Référent tracts" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-pink-500 outline-none">
                </div>
                <div class="flex justify-end gap-2 pt-3">
                    <button type="button" onclick="closeModal('modal-militant')" class="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-lg">Annuler</button>
                    <button type="submit" class="px-4 py-2 text-xs font-semibold bg-pink-600 hover:bg-pink-700 text-white rounded-lg shadow">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL MATÉRIEL -->
    <div id="modal-item" class="fixed inset-0 modal-bg z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100 relative">
            <h3 id="modal-item-title" class="text-lg font-bold text-slate-900 mb-4">Attribuer du matériel</h3>
            <form onsubmit="handleSaveItem(event)" class="space-y-4">
                <input type="hidden" id="item-id">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Militant responsable *</label>
                    <select id="item-militant" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-pink-500 outline-none bg-white"></select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Catégorie / Type *</label>
                    <select id="item-category" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-pink-500 outline-none bg-white"></select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Titre / Précision du matériel</label>
                    <input type="text" id="item-title" placeholder="Ex: Tracts A5 Mobilisation" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-pink-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Quantité *</label>
                    <input type="number" id="item-quantity" min="1" value="1" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-pink-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Détail / Emplacement / Notes</label>
                    <input type="text" id="item-details" placeholder="Ex: Dans son sac à dos, Chez elle, Garage..." class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-pink-500 outline-none">
                </div>
                <div class="flex justify-end gap-2 pt-3">
                    <button type="button" onclick="closeModal('modal-item')" class="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-lg">Annuler</button>
                    <button type="submit" class="px-4 py-2 text-xs font-semibold bg-pink-600 hover:bg-pink-700 text-white rounded-lg shadow">Sauvegarder</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL TRANSFERT -->
    <div id="modal-transfer" class="fixed inset-0 modal-bg z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl border border-slate-100 relative">
            <h3 class="text-lg font-bold text-slate-900 mb-2">Transférer le matériel</h3>
            <p id="transfer-item-desc" class="text-xs text-slate-500 mb-4"></p>
            <form onsubmit="handleSaveTransfer(event)" class="space-y-4">
                <input type="hidden" id="transfer-item-id">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Nouveau détenteur *</label>
                    <select id="transfer-militant" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-pink-500 outline-none bg-white"></select>
                </div>
                <div class="flex justify-end gap-2 pt-3">
                    <button type="button" onclick="closeModal('modal-transfer')" class="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-lg">Annuler</button>
                    <button type="submit" class="px-4 py-2 text-xs font-semibold bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg shadow">Confirmer le transfert</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL TYPES DE MATÉRIEL -->
    <div id="modal-categories" class="fixed inset-0 modal-bg z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100 relative">
            <h3 class="text-lg font-bold text-slate-900 mb-4">Gestion des catégories</h3>
            
            <form onsubmit="handleAddCategory(event)" class="flex gap-2 mb-4">
                <input type="text" id="new-cat-name" placeholder="Nouvelle catégorie (ex: Drapeaux)" required class="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-pink-500 outline-none">
                <button type="submit" class="bg-slate-800 hover:bg-slate-900 text-white px-3 py-2 rounded-lg text-xs font-semibold">Ajouter</button>
            </form>

            <div id="categories-list" class="space-y-2 max-h-60 overflow-y-auto pr-1"></div>

            <div class="flex justify-end pt-4 border-t border-slate-100 mt-4">
                <button type="button" onclick="closeModal('modal-categories')" class="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-lg">Fermer</button>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURATION FIREBASE
        const firebaseConfig = {
            databaseURL: "https://inventaire-militant-default-rtdb.europe-west1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ÉTAT APPLICATION
        let appState = {
            militants: {},
            items: {},
            categories: ["Affiches", "Colle", "Tracts", "Barnum", "Tables", "Enceinte", "Micro", "Divers"],
            currentView: "militant"
        };

        // COULEURS BADGES PAR CATÉGORIE
        const catColors = {
            "Affiches": "bg-purple-100 text-purple-700 border-purple-200",
            "Colle": "bg-amber-100 text-amber-800 border-amber-200",
            "Tracts": "bg-blue-100 text-blue-700 border-blue-200",
            "Barnum": "bg-emerald-100 text-emerald-700 border-emerald-200",
            "Tables": "bg-sky-100 text-sky-700 border-sky-200",
            "Enceinte": "bg-indigo-100 text-indigo-700 border-indigo-200",
            "Micro": "bg-rose-100 text-rose-700 border-rose-200"
        };

        function getCatBadgeClass(cat) {
            return catColors[cat] || "bg-slate-100 text-slate-700 border-slate-200";
        }

        // INITIALISATION ECOUTEURS TEMPS RÉEL (Direct & Instantané)
        db.ref('categories').on('value', snap => {
            if (snap.exists()) {
                appState.categories = snap.val();
            } else {
                db.ref('categories').set(appState.categories);
            }
            updateCategoryDropdowns();
            renderApp();
        });

        db.ref('militants').on('value', snap => {
            appState.militants = snap.val() || {};
            document.getElementById('militants-count').innerText = Object.keys(appState.militants).length;
            renderApp();
        });

        db.ref('items').on('value', snap => {
            appState.items = snap.val() || {};
            renderApp();
        });

        function switchView(view) {
            appState.currentView = view;
            const btnM = document.getElementById('btn-view-militant');
            const btnMat = document.getElementById('btn-view-material');
            
            if (view === 'militant') {
                btnM.className = "flex-1 md:flex-none px-4 py-2 rounded-md text-xs sm:text-sm font-semibold transition bg-white text-slate-900 shadow-sm flex items-center justify-center gap-2";
                btnMat.className = "flex-1 md:flex-none px-4 py-2 rounded-md text-xs sm:text-sm font-semibold transition text-slate-600 hover:text-slate-900 flex items-center justify-center gap-2";
                document.getElementById('militant-view').classList.remove('hidden');
                document.getElementById('material-view').classList.add('hidden');
            } else {
                btnMat.className = "flex-1 md:flex-none px-4 py-2 rounded-md text-xs sm:text-sm font-semibold transition bg-white text-slate-900 shadow-sm flex items-center justify-center gap-2";
                btnM.className = "flex-1 md:flex-none px-4 py-2 rounded-md text-xs sm:text-sm font-semibold transition text-slate-600 hover:text-slate-900 flex items-center justify-center gap-2";
                document.getElementById('militant-view').classList.add('hidden');
                document.getElementById('material-view').classList.remove('hidden');
            }
            renderApp();
        }

        function updateCategoryDropdowns() {
            const selects = [document.getElementById('filter-category'), document.getElementById('item-category')];
            selects.forEach(sel => {
                if (!sel) return;
                const current = sel.value;
                const isFilter = sel.id === 'filter-category';
                sel.innerHTML = isFilter ? '<option value="">Toutes les catégories</option>' : '';
                appState.categories.forEach(c => {
                    sel.innerHTML += `<option value="${c}">${c}</option>`;
                });
                if (current && appState.categories.includes(current)) sel.value = current;
            });
            renderCategoryList();
        }

        function renderApp() {
            const search = document.getElementById('search-input').value.toLowerCase().trim();
            const filterCat = document.getElementById('filter-category').value;

            // 1. STATS
            const statsContainer = document.getElementById('stats-container');
            statsContainer.innerHTML = '';
            
            const catTotals = {};
            appState.categories.forEach(c => catTotals[c] = 0);
            
            Object.values(appState.items).forEach(item => {
                if (catTotals[item.category] !== undefined) {
                    catTotals[item.category] += Number(item.quantity || 0);
                } else {
                    catTotals[item.category] = Number(item.quantity || 0);
                }
            });

            appState.categories.forEach(cat => {
                const total = catTotals[cat] || 0;
                statsContainer.innerHTML += `
                    <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm text-center flex flex-col justify-center">
                        <span class="text-[10px] font-bold tracking-wider text-slate-400 uppercase">${cat}</span>
                        <span class="text-xl font-black text-slate-800 mt-0.5">${total}</span>
                    </div>
                `;
            });

            // 2. VUE PAR MILITANT
            const militantView = document.getElementById('militant-view');
            militantView.innerHTML = '';

            const militantsList = Object.entries(appState.militants);

            if (militantsList.length === 0) {
                militantView.innerHTML = `
                    <div class="bg-white rounded-xl p-8 text-center text-slate-400 border border-slate-200">
                        <i class="fa-solid fa-users text-4xl mb-2 text-slate-300"></i>
                        <p class="text-sm font-medium">Aucun militant enregistré.</p>
                        <button onclick="openMilitantModal()" class="mt-3 px-4 py-2 bg-pink-600 text-white rounded-lg text-xs font-semibold">Ajouter un militant</button>
                    </div>
                `;
            }

            militantsList.forEach(([mId, mData]) => {
                const matchSearch = mData.name.toLowerCase().includes(search) || 
                                    (mData.phone && mData.phone.toLowerCase().includes(search)) ||
                                    (mData.sector && mData.sector.toLowerCase().includes(search)) ||
                                    (mData.role && mData.role.toLowerCase().includes(search));

                let mItems = Object.entries(appState.items)
                    .filter(([iId, item]) => item.militantId === mId)
                    .filter(([iId, item]) => !filterCat || item.category === filterCat)
                    .filter(([iId, item]) => {
                        if (!search) return true;
                        return matchSearch || 
                               (item.category && item.category.toLowerCase().includes(search)) ||
                               (item.title && item.title.toLowerCase().includes(search)) ||
                               (item.details && item.details.toLowerCase().includes(search));
                    });

                if (search && !matchSearch && mItems.length === 0) return;

                let subtitleParts = [];
                if (mData.phone) subtitleParts.push(`<i class="fa-solid fa-phone text-[10px] mr-1"></i>${mData.phone}`);
                if (mData.sector) subtitleParts.push(`Secteur : ${mData.sector}`);
                if (mData.role) subtitleParts.push(`Rôle : ${mData.role}`);
                const subtitleStr = subtitleParts.join(' • ');

                let itemsGridHtml = '';
                if (mItems.length === 0) {
                    itemsGridHtml = `<p class="text-xs text-slate-400 italic p-4">Aucun matériel attribué</p>`;
                } else {
                    itemsGridHtml = `<div class="grid grid-cols-1 md:grid-cols-2 gap-3 p-4">`;
                    mItems.forEach(([iId, item]) => {
                        itemsGridHtml += `
                            <div class="bg-slate-50 rounded-xl p-3 border border-slate-200/80 hover:border-slate-300 transition flex flex-col justify-between">
                                <div>
                                    <div class="flex justify-between items-start gap-2 mb-1">
                                        <span class="inline-block text-[11px] font-semibold px-2 py-0.5 rounded-md border ${getCatBadgeClass(item.category)}">
                                            ${item.category}
                                        </span>
                                        <span class="text-sm font-extrabold text-slate-800">x${item.quantity}</span>
                                    </div>
                                    <h4 class="text-xs font-bold text-slate-800">${item.title || item.category}</h4>
                                    ${item.details ? `<p class="text-[11px] text-slate-500 mt-1 flex items-center gap-1"><i class="fa-solid fa-location-dot text-[10px] text-slate-400"></i> ${item.details}</p>` : ''}
                                </div>
                                
                                <div class="flex justify-between items-center mt-3 pt-2 border-t border-slate-200/60">
                                    <button onclick="openTransferModal('${iId}')" class="text-indigo-600 hover:text-indigo-800 text-xs font-semibold flex items-center gap-1">
                                        <i class="fa-solid fa-arrow-right-arrow-left text-[10px]"></i> Transférer
                                    </button>
                                    <div class="flex items-center gap-2">
                                        <button onclick="openItemModal('${iId}')" class="text-slate-400 hover:text-slate-700 text-xs"><i class="fa-solid fa-pen"></i></button>
                                        <button onclick="deleteItem('${iId}')" class="text-slate-400 hover:text-rose-600 text-xs"><i class="fa-solid fa-trash-can"></i></button>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    itemsGridHtml += `</div>`;
                }

                militantView.innerHTML += `
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="bg-[#0f172a] text-white px-5 py-3 flex justify-between items-center">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded-full bg-pink-600 flex items-center justify-center font-bold text-xs uppercase text-white shadow">
                                    ${mData.name.substring(0, 2)}
                                </div>
                                <div>
                                    <div class="flex items-center gap-2">
                                        <h3 class="font-bold text-sm tracking-tight">${mData.name}</h3>
                                        <button onclick="openMilitantModal('${mId}')" class="text-slate-400 hover:text-white text-xs"><i class="fa-solid fa-pen"></i></button>
                                        <button onclick="deleteMilitant('${mId}')" class="text-slate-400 hover:text-rose-400 text-xs"><i class="fa-solid fa-trash"></i></button>
                                    </div>
                                    ${subtitleStr ? `<p class="text-[11px] text-slate-400">${subtitleStr}</p>` : ''}
                                </div>
                            </div>
                            <button onclick="openItemForMilitant('${mId}')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs text-slate-200 px-3 py-1.5 rounded-lg font-medium transition flex items-center gap-1.5">
                                <i class="fa-solid fa-plus text-pink-400"></i> Ajouter du matos
                            </button>
                        </div>
                        ${itemsGridHtml}
                    </div>
                `;
            });

            // 3. VUE PAR MATÉRIEL (REGROUPEMENT PAR CATÉGORIE)
            const materialView = document.getElementById('material-view');
            materialView.innerHTML = '';

            const itemsByCategory = {};
            appState.categories.forEach(c => itemsByCategory[c] = []);

            Object.entries(appState.items).forEach(([iId, item]) => {
                if (!filterCat || item.category === filterCat) {
                    if (!itemsByCategory[item.category]) itemsByCategory[item.category] = [];
                    itemsByCategory[item.category].push({ id: iId, ...item });
                }
            });

            let hasMaterial = false;

            Object.entries(itemsByCategory).forEach(([catName, itemsList]) => {
                const filteredItems = itemsList.filter(item => {
                    if (!search) return true;
                    const mData = appState.militants[item.militantId] || { name: '' };
                    return catName.toLowerCase().includes(search) ||
                           (item.title && item.title.toLowerCase().includes(search)) ||
                           (item.details && item.details.toLowerCase().includes(search)) ||
                           mData.name.toLowerCase().includes(search);
                });

                if (filteredItems.length === 0) return;
                hasMaterial = true;

                const totalCatQty = filteredItems.reduce((sum, i) => sum + Number(i.quantity || 0), 0);

                let holdersHtml = '';
                filteredItems.forEach(item => {
                    const mData = appState.militants[item.militantId] || { name: 'Inconnu' };
                    holdersHtml += `
                        <div class="bg-slate-50 p-3 rounded-xl border border-slate-200/80 mb-2 last:mb-0">
                            <div class="flex justify-between items-start gap-2">
                                <div>
                                    <div class="text-xs font-bold text-slate-800 flex items-center gap-1.5">
                                        <i class="fa-regular fa-user text-pink-600 text-[10px]"></i> ${mData.name}
                                    </div>
                                    <p class="text-[11px] font-semibold text-slate-700 mt-0.5">${item.title || catName}</p>
                                    ${item.details ? `<p class="text-[10px] text-slate-500 mt-0.5 flex items-center gap-1"><i class="fa-solid fa-location-dot text-slate-400"></i> ${item.details}</p>` : ''}
                                </div>
                                <span class="text-xs font-black bg-white px-2 py-1 rounded-md border border-slate-200 text-slate-800">x${item.quantity}</span>
                            </div>

                            <div class="flex justify-between items-center mt-2 pt-2 border-t border-slate-200/60">
                                <button onclick="openTransferModal('${item.id}')" class="text-indigo-600 hover:text-indigo-800 text-[11px] font-semibold flex items-center gap-1">
                                    <i class="fa-solid fa-arrow-right-arrow-left text-[9px]"></i> Transférer
                                </button>
                                <div class="flex items-center gap-2">
                                    <button onclick="openItemModal('${item.id}')" class="text-slate-400 hover:text-slate-700 text-xs"><i class="fa-solid fa-pen"></i></button>
                                    <button onclick="deleteItem('${item.id}')" class="text-slate-400 hover:text-rose-600 text-xs"><i class="fa-solid fa-trash-can"></i></button>
                                </div>
                            </div>
                        </div>
                    `;
                });

                materialView.innerHTML += `
                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-100">
                                <span class="text-xs font-bold px-2.5 py-1 rounded-md border ${getCatBadgeClass(catName)}">
                                    ${catName}
                                </span>
                                <div class="text-right">
                                    <span class="text-xs text-slate-400 block uppercase font-bold tracking-wider">Total</span>
                                    <span class="text-sm font-black text-slate-800">x${totalCatQty}</span>
                                </div>
                            </div>

                            <div class="space-y-2">
                                ${holdersHtml}
                            </div>
                        </div>
                    </div>
                `;
            });

            if (!hasMaterial) {
                materialView.innerHTML = `
                    <div class="col-span-full bg-white rounded-xl p-8 text-center text-slate-400 border border-slate-200">
                        <i class="fa-solid fa-boxes-stacked text-4xl mb-2 text-slate-300"></i>
                        <p class="text-sm font-medium">Aucun matériel trouvé.</p>
                    </div>
                `;
            }
        }

        // --- GESTION DES MODALES ET ACTIONS ---

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        // MILITANTS
        function openMilitantModal(mId = null) {
            document.getElementById('militant-id').value = mId || '';
            document.getElementById('modal-militant-title').innerText = mId ? 'Modifier le militant' : 'Ajouter un militant';
            
            if (mId && appState.militants[mId]) {
                const m = appState.militants[mId];
                document.getElementById('militant-name').value = m.name || '';
                document.getElementById('militant-phone').value = m.phone || '';
                document.getElementById('militant-sector').value = m.sector || '';
                document.getElementById('militant-role').value = m.role || '';
            } else {
                document.getElementById('militant-name').value = '';
                document.getElementById('militant-phone').value = '';
                document.getElementById('militant-sector').value = '';
                document.getElementById('militant-role').value = '';
            }
            document.getElementById('modal-militant').classList.remove('hidden');
        }

        function handleSaveMilitant(e) {
            e.preventDefault();
            const id = document.getElementById('militant-id').value || db.ref('militants').push().key;
            const data = {
                name: document.getElementById('militant-name').value.trim(),
                phone: document.getElementById('militant-phone').value.trim(),
                sector: document.getElementById('militant-sector').value.trim(),
                role: document.getElementById('militant-role').value.trim()
            };

            db.ref('militants/' + id).set(data, (error) => {
                if (!error) closeModal('modal-militant');
            });
        }

        function deleteMilitant(mId) {
            if (confirm("Supprimer ce militant ? Le matériel associé ne sera pas supprimé mais devra être réattribué.")) {
                db.ref('militants/' + mId).remove();
            }
        }

        // MATÉRIEL
        function populateMilitantsDropdown(selectId) {
            const sel = document.getElementById(selectId);
            sel.innerHTML = '';
            Object.entries(appState.militants).forEach(([mId, mData]) => {
                sel.innerHTML += `<option value="${mId}">${mData.name}</option>`;
            });
        }

        function openItemModal(iId = null) {
            if (Object.keys(appState.militants).length === 0) {
                alert("Veuillez d'abord ajouter au moins un militant.");
                openMilitantModal();
                return;
            }

            populateMilitantsDropdown('item-militant');
            updateCategoryDropdowns();

            document.getElementById('item-id').value = iId || '';
            document.getElementById('modal-item-title').innerText = iId ? 'Modifier le matériel' : 'Attribuer du matériel';

            if (iId && appState.items[iId]) {
                const item = appState.items[iId];
                document.getElementById('item-militant').value = item.militantId;
                document.getElementById('item-category').value = item.category;
                document.getElementById('item-title').value = item.title || '';
                document.getElementById('item-quantity').value = item.quantity || 1;
                document.getElementById('item-details').value = item.details || '';
            } else {
                document.getElementById('item-title').value = '';
                document.getElementById('item-quantity').value = 1;
                document.getElementById('item-details').value = '';
            }
            document.getElementById('modal-item').classList.remove('hidden');
        }

        function openItemForMilitant(mId) {
            openItemModal();
            document.getElementById('item-militant').value = mId;
        }

        function handleSaveItem(e) {
            e.preventDefault();
            const id = document.getElementById('item-id').value || db.ref('items').push().key;
            const data = {
                militantId: document.getElementById('item-militant').value,
                category: document.getElementById('item-category').value,
                title: document.getElementById('item-title').value.trim(),
                quantity: Number(document.getElementById('item-quantity').value),
                details: document.getElementById('item-details').value.trim()
            };

            db.ref('items/' + id).set(data, (error) => {
                if (!error) closeModal('modal-item');
            });
        }

        function deleteItem(iId) {
            if (confirm("Supprimer ce matériel de l'inventaire ?")) {
                db.ref('items/' + iId).remove();
            }
        }

        // TRANSFERT
        function openTransferModal(iId) {
            const item = appState.items[iId];
            if (!item) return;

            populateMilitantsDropdown('transfer-militant');
            document.getElementById('transfer-item-id').value = iId;
            
            const currentHolder = appState.militants[item.militantId] ? appState.militants[item.militantId].name : 'Inconnu';
            document.getElementById('transfer-item-desc').innerText = `${item.category} (${item.title || 'Sans titre'}) x${item.quantity} - Actuellement chez ${currentHolder}`;

            document.getElementById('modal-transfer').classList.remove('hidden');
        }

        function handleSaveTransfer(e) {
            e.preventDefault();
            const iId = document.getElementById('transfer-item-id').value;
            const newMilitantId = document.getElementById('transfer-militant').value;

            db.ref(`items/${iId}/militantId`).set(newMilitantId, (error) => {
                if (!error) closeModal('modal-transfer');
            });
        }

        // CATÉGORIES
        function openCategoryModal() {
            renderCategoryList();
            document.getElementById('modal-categories').classList.remove('hidden');
        }

        function renderCategoryList() {
            const list = document.getElementById('categories-list');
            if (!list) return;
            list.innerHTML = '';
            appState.categories.forEach((cat, index) => {
                list.innerHTML += `
                    <div class="flex justify-between items-center bg-slate-50 p-2 rounded-lg border border-slate-200 text-xs">
                        <span class="font-bold text-slate-700">${cat}</span>
                        <div class="flex items-center gap-2">
                            <button onclick="renameCategory(${index})" class="text-slate-400 hover:text-slate-700"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="deleteCategory(${index})" class="text-slate-400 hover:text-rose-600"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>
                `;
            });
        }

        function handleAddCategory(e) {
            e.preventDefault();
            const input = document.getElementById('new-cat-name');
            const name = input.value.trim();
            if (name && !appState.categories.includes(name)) {
                appState.categories.push(name);
                db.ref('categories').set(appState.categories);
                input.value = '';
            }
        }

        function renameCategory(index) {
            const oldName = appState.categories[index];
            const newName = prompt("Nouveau nom pour la catégorie :", oldName);
            if (newName && newName.trim() && newName !== oldName) {
                appState.categories[index] = newName.trim();
                db.ref('categories').set(appState.categories);

                Object.entries(appState.items).forEach(([iId, item]) => {
                    if (item.category === oldName) {
                        db.ref(`items/${iId}/category`).set(newName.trim());
                    }
                });
            }
        }

        function deleteCategory(index) {
            const cat = appState.categories[index];
            if (confirm(`Supprimer la catégorie "${cat}" ?`)) {
                appState.categories.splice(index, 1);
                db.ref('categories').set(appState.categories);
            }
        }

        // SAUVEGARDE / EXPORT DATA
        function exportData() {
            const data = {
                militants: appState.militants,
                items: appState.items,
                categories: appState.categories
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `sauvegarde-matos-militant-${new Date().toISOString().slice(0,10)}.json`;
            a.click();
        }
    </script>
</body>
</html>
