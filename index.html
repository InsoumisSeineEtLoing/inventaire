<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion de Matériel Militant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Firebase JS SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 pb-20">

  <!-- Header -->
  <header class="bg-red-700 text-white p-4 shadow-md sticky top-0 z-30">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold flex items-center gap-2">
          <i data-lucide="box"></i> Inventaire Militant
        </h1>
        <p class="text-xs text-red-200">Suivi & Synchronisation en direct</p>
      </div>
      <div class="flex gap-2">
        <button onclick="openModal('categoriesModal')" class="bg-red-800 hover:bg-red-900 px-3 py-1.5 rounded text-xs flex items-center gap-1 font-semibold transition">
          <i data-lucide="tags" class="w-4 h-4"></i> Types
        </button>
        <button onclick="openModal('militantsModal')" class="bg-red-800 hover:bg-red-900 px-3 py-1.5 rounded text-xs flex items-center gap-1 font-semibold transition">
          <i data-lucide="users" class="w-4 h-4"></i> Militants
        </button>
      </div>
    </div>
  </header>

  <!-- Navigation par onglets -->
  <main class="max-w-4xl mx-auto p-4">
    <div class="flex border-b border-gray-300 mb-4 bg-white rounded-t-lg overflow-hidden shadow-sm">
      <button id="tab-material" onclick="switchTab('material')" class="flex-1 py-3 text-center font-semibold text-red-700 border-b-2 border-red-700 flex justify-center items-center gap-2">
        <i data-lucide="package"></i> Matériel (<span id="matCount">0</span>)
      </button>
      <button id="tab-militants" onclick="switchTab('militants')" class="flex-1 py-3 text-center font-semibold text-gray-500 hover:text-red-700 flex justify-center items-center gap-2">
        <i data-lucide="user-check"></i> Par Militant (<span id="militantCount">0</span>)
      </button>
    </div>

    <!-- Filtres et Recherche -->
    <div class="bg-white p-3 rounded-lg shadow-sm mb-4 flex flex-col sm:flex-row gap-2">
      <div class="relative flex-1">
        <i data-lucide="search" class="absolute left-3 top-2.5 w-4 h-4 text-gray-400"></i>
        <input type="text" id="searchInput" oninput="renderApp()" placeholder="Rechercher du matériel, un militant..." class="w-full pl-9 pr-3 py-1.5 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-red-500">
      </div>
      <select id="categoryFilter" onchange="renderApp()" class="border rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-red-500 bg-white">
        <option value="ALL">Toutes les catégories</option>
      </select>
    </div>

    <!-- Vue 1: Liste du matériel -->
    <div id="view-material" class="space-y-3"></div>

    <!-- Vue 2: Liste par militant -->
    <div id="view-militants" class="hidden space-y-4"></div>
  </main>

  <!-- Bouton d'ajout flottant -->
  <button onclick="openAddMaterialModal()" class="fixed bottom-5 right-5 bg-red-600 hover:bg-red-700 text-white p-4 rounded-full shadow-lg flex items-center justify-center transition transform active:scale-95 z-20">
    <i data-lucide="plus" class="w-6 h-6"></i>
  </button>

  <!-- MODAL: Ajouter / Éditer Matériel -->
  <div id="materialModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
      <button onclick="closeModal('materialModal')" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600">
        <i data-lucide="x"></i>
      </button>
      <h2 id="materialModalTitle" class="text-lg font-bold mb-4">Ajouter du matériel</h2>
      <form id="materialForm" onsubmit="saveMaterial(event)" class="space-y-4">
        <input type="hidden" id="matId">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Nom de l'élément / Description</label>
          <input type="text" id="matName" required placeholder="ex: Barnum 3x3m LFI, Affiches A3, Megaphone..." class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-red-500 outline-none">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Catégorie / Type</label>
            <select id="matCategory" required class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-red-500 outline-none bg-white"></select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Quantité</label>
            <input type="number" id="matQuantity" min="1" value="1" required class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-red-500 outline-none">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Attribué à (Militant)</label>
          <select id="matHolder" required class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-red-500 outline-none bg-white"></select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">État / Remarques (Optionnel)</label>
          <input type="text" id="matNotes" placeholder="ex: Pied légèrement abîmé, Dans le sac bleu..." class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-red-500 outline-none">
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeModal('materialModal')" class="px-4 py-2 border rounded text-sm hover:bg-gray-100">Annuler</button>
          <button type="submit" class="px-4 py-2 bg-red-600 text-white rounded text-sm hover:bg-red-700 font-semibold">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: Gérer les Types de matériel -->
  <div id="categoriesModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
      <button onclick="closeModal('categoriesModal')" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600">
        <i data-lucide="x"></i>
      </button>
      <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
        <i data-lucide="tags" class="text-red-600"></i> Types de matériel
      </h2>
      <form onsubmit="addCategory(event)" class="flex gap-2 mb-4">
        <input type="text" id="newCategoryName" placeholder="Nouveau type (ex: Groupe Électrogène)" required class="flex-1 border rounded p-2 text-sm outline-none focus:ring-2 focus:ring-red-500">
        <button type="submit" class="bg-red-600 text-white px-3 py-2 rounded text-sm font-semibold hover:bg-red-700 flex items-center gap-1">
          <i data-lucide="plus" class="w-4 h-4"></i> Ajouter
        </button>
      </form>
      <div id="categoriesList" class="space-y-2 border-t pt-3"></div>
    </div>
  </div>

  <!-- MODAL: Gérer les Militants -->
  <div id="militantsModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
      <button onclick="closeModal('militantsModal')" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600">
        <i data-lucide="x"></i>
      </button>
      <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
        <i data-lucide="users" class="text-red-600"></i> Liste des militants
      </h2>
      <form onsubmit="addMilitant(event)" class="space-y-2 mb-4 bg-gray-50 p-3 rounded-lg border">
        <div class="text-xs font-semibold text-gray-600">Ajouter un militant</div>
        <input type="text" id="newMilitantName" placeholder="Nom Prénom" required class="w-full border rounded p-2 text-sm outline-none focus:ring-2 focus:ring-red-500">
        <div class="grid grid-cols-2 gap-2">
          <input type="tel" id="newMilitantPhone" placeholder="Téléphone (ex: 0612345678)" class="border rounded p-2 text-sm outline-none">
          <input type="text" id="newMilitantCity" placeholder="Ville / Secteur" class="border rounded p-2 text-sm outline-none">
        </div>
        <button type="submit" class="w-full bg-red-600 text-white py-2 rounded text-sm font-semibold hover:bg-red-700 flex justify-center items-center gap-1">
          <i data-lucide="user-plus" class="w-4 h-4"></i> Enregistrer le militant
        </button>
      </form>
      <div id="militantsList" class="space-y-2 border-t pt-3"></div>
    </div>
  </div>

  <!-- SCRIPT LOGIQUE & FIREBASE -->
  <script>
    // Configuration Firebase pré-remplie avec vos clés
    const firebaseConfig = {
      apiKey: "AIzaSyC1IBbYeNVdTXkpeS24HSagh9JXvOO3km4",
      authDomain: "inventaire-militant.firebaseapp.com",
      databaseURL: "https://inventaire-militant-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "inventaire-militant",
      storageBucket: "inventaire-militant.firebasestorage.app",
      messagingSenderId: "20668659395",
      appId: "1:20668659395:web:a4b50d2e1f4929e409d476",
      measurementId: "G-BQ0ZEVDQBV"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Données par défaut
    let categories = ["Barnum / Table", "Sonorisation", "Affichage / Affiches", "Tracts / Documents", "Drapeaux / Banderoles", "Autre"];
    let militants = [
      { id: 'm1', name: 'Stock Local / Réserve', phone: '', city: 'Local' },
      { id: 'm2', name: 'Camarade Exemple', phone: '06 00 00 00 00', city: 'Secteur Centre' }
    ];
    let materials = [];

    // Connexion Firebase en Temps Réel
    db.ref('inventory').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        if (data.categories) categories = data.categories;
        if (data.militants) militants = data.militants;
        if (data.materials) {
          materials = Array.isArray(data.materials) ? data.materials : Object.values(data.materials);
        } else {
          materials = [];
        }
      }
      renderApp();
    });

    function syncToFirebase() {
      db.ref('inventory').set({
        categories: categories,
        militants: militants,
        materials: materials
      });
    }

    // Gestion Onglets
    function switchTab(tab) {
      if (tab === 'material') {
        document.getElementById('view-material').classList.remove('hidden');
        document.getElementById('view-militants').classList.add('hidden');
        document.getElementById('tab-material').className = "flex-1 py-3 text-center font-semibold text-red-700 border-b-2 border-red-700 flex justify-center items-center gap-2";
        document.getElementById('tab-militants').className = "flex-1 py-3 text-center font-semibold text-gray-500 hover:text-red-700 flex justify-center items-center gap-2";
      } else {
        document.getElementById('view-material').classList.add('hidden');
        document.getElementById('view-militants').classList.remove('hidden');
        document.getElementById('tab-militants').className = "flex-1 py-3 text-center font-semibold text-red-700 border-b-2 border-red-700 flex justify-center items-center gap-2";
        document.getElementById('tab-material').className = "flex-1 py-3 text-center font-semibold text-gray-500 hover:text-red-700 flex justify-center items-center gap-2";
      }
    }

    // Affichage principal
    function renderApp() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const catFilter = document.getElementById('categoryFilter').value;

      // Update dropdowns
      updateSelectOptions();

      // Render Vue Matériel
      const matContainer = document.getElementById('view-material');
      matContainer.innerHTML = '';

      const filteredMaterials = materials.filter(m => {
        const matchSearch = m.name.toLowerCase().includes(search) || m.holder.toLowerCase().includes(search) || (m.notes && m.notes.toLowerCase().includes(search));
        const matchCat = catFilter === 'ALL' || m.category === catFilter;
        return matchSearch && matchCat;
      });

      document.getElementById('matCount').innerText = materials.length;
      document.getElementById('militantCount').innerText = militants.length;

      if (filteredMaterials.length === 0) {
        matContainer.innerHTML = `<div class="text-center py-8 text-gray-400">Aucun matériel trouvé.</div>`;
      } else {
        filteredMaterials.forEach(m => {
          matContainer.innerHTML += `
            <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-100 flex justify-between items-center">
              <div class="space-y-1">
                <div class="flex items-center gap-2">
                  <span class="font-bold text-gray-800">${m.name}</span>
                  <span class="bg-red-100 text-red-700 text-xs px-2 py-0.5 rounded-full font-medium">x${m.quantity}</span>
                  <span class="bg-gray-100 text-gray-600 text-xs px-2 py-0.5 rounded">${m.category}</span>
                </div>
                <div class="text-xs text-gray-500 flex items-center gap-1">
                  <i data-lucide="user" class="w-3 h-3"></i> Chez: <strong class="text-gray-700">${m.holder}</strong>
                </div>
                ${m.notes ? `<div class="text-xs text-gray-400 italic">${m.notes}</div>` : ''}
              </div>
              <div class="flex gap-1">
                <button onclick="editMaterial('${m.id}')" class="p-2 text-gray-400 hover:text-blue-600 rounded">
                  <i data-lucide="edit-3" class="w-4 h-4"></i>
                </button>
                <button onclick="deleteMaterial('${m.id}')" class="p-2 text-gray-400 hover:text-red-600 rounded">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              </div>
            </div>
          `;
        });
      }

      // Render Vue Militants
      const milContainer = document.getElementById('view-militants');
      milContainer.innerHTML = '';

      militants.forEach(militant => {
        const itemsHold = materials.filter(m => m.holder === militant.name);
        milContainer.innerHTML += `
          <div class="bg-white rounded-lg shadow-sm border p-4">
            <div class="flex justify-between items-start mb-2">
              <div>
                <h3 class="font-bold text-gray-800 flex items-center gap-2">
                  ${militant.name}
                  ${militant.city ? `<span class="text-xs font-normal bg-gray-100 text-gray-600 px-2 py-0.5 rounded">${militant.city}</span>` : ''}
                </h3>
                ${militant.phone ? `<a href="tel:${militant.phone}" class="text-xs text-blue-600 hover:underline flex items-center gap-1 mt-0.5"><i data-lucide="phone" class="w-3 h-3"></i> ${militant.phone}</a>` : ''}
              </div>
              <span class="text-xs bg-red-50 text-red-700 font-semibold px-2.5 py-1 rounded-full border border-red-100">
                ${itemsHold.reduce((acc, curr) => acc + Number(curr.quantity), 0)} élément(s)
              </span>
            </div>
            <div class="border-t pt-2 mt-2 space-y-1">
              ${itemsHold.length === 0 ? '<div class="text-xs text-gray-400 italic">Aucun matériel attribué.</div>' : ''}
              ${itemsHold.map(item => `
                <div class="text-xs bg-gray-50 p-2 rounded flex justify-between items-center">
                  <span><strong>${item.name}</strong> (x${item.quantity}) - <span class="text-gray-500">${item.category}</span></span>
                  <button onclick="editMaterial('${item.id}')" class="text-blue-600 hover:underline text-[10px]">Transférer</button>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      });

      renderCategoriesList();
      renderMilitantsList();
      lucide.createIcons();
    }

    function updateSelectOptions() {
      const catSelect = document.getElementById('matCategory');
      const catFilter = document.getElementById('categoryFilter');
      const holderSelect = document.getElementById('matHolder');

      const currentCatFilter = catFilter.value;
      catFilter.innerHTML = '<option value="ALL">Toutes les catégories</option>';
      categories.forEach(c => {
        catFilter.innerHTML += `<option value="${c}">${c}</option>`;
      });
      catFilter.value = currentCatFilter;

      catSelect.innerHTML = categories.map(c => `<option value="${c}">${c}</option>`).join('');
      holderSelect.innerHTML = militants.map(m => `<option value="${m.name}">${m.name}</option>`).join('');
    }

    // Actions Matériel
    function openAddMaterialModal() {
      document.getElementById('materialModalTitle').innerText = "Ajouter du matériel";
      document.getElementById('matId').value = "";
      document.getElementById('materialForm').reset();
      openModal('materialModal');
    }

    function saveMaterial(e) {
      e.preventDefault();
      const id = document.getElementById('matId').value || 'mat_' + Date.now();
      const name = document.getElementById('matName').value;
      const category = document.getElementById('matCategory').value;
      const quantity = document.getElementById('matQuantity').value;
      const holder = document.getElementById('matHolder').value;
      const notes = document.getElementById('matNotes').value;

      const existingIndex = materials.findIndex(m => m.id === id);
      const newMat = { id, name, category, quantity, holder, notes };

      if (existingIndex >= 0) {
        materials[existingIndex] = newMat;
      } else {
        materials.push(newMat);
      }

      syncToFirebase();
      closeModal('materialModal');
    }

    function editMaterial(id) {
      const m = materials.find(item => item.id === id);
      if (!m) return;

      document.getElementById('materialModalTitle').innerText = "Modifier le matériel";
      document.getElementById('matId').value = m.id;
      document.getElementById('matName').value = m.name;
      document.getElementById('matCategory').value = m.category;
      document.getElementById('matQuantity').value = m.quantity;
      document.getElementById('matHolder').value = m.holder;
      document.getElementById('matNotes').value = m.notes || '';

      openModal('materialModal');
    }

    function deleteMaterial(id) {
      if (confirm("Supprimer cet élément du matériel ?")) {
        materials = materials.filter(m => m.id !== id);
        syncToFirebase();
      }
    }

    // Actions Categories
    function addCategory(e) {
      e.preventDefault();
      const name = document.getElementById('newCategoryName').value.trim();
      if (name && !categories.includes(name)) {
        categories.push(name);
        syncToFirebase();
        document.getElementById('newCategoryName').value = '';
      }
    }

    function deleteCategory(catName) {
      if (materials.some(m => m.category === catName)) {
        alert("Impossible de supprimer cette catégorie car du matériel y est associé !");
        return;
      }
      categories = categories.filter(c => c !== catName);
      syncToFirebase();
    }

    function renderCategoriesList() {
      const list = document.getElementById('categoriesList');
      list.innerHTML = categories.map(c => `
        <div class="flex justify-between items-center p-2 bg-gray-50 rounded text-sm">
          <span>${c}</span>
          <button onclick="deleteCategory('${c}')" class="text-red-500 hover:text-red-700">
            <i data-lucide="trash" class="w-4 h-4"></i>
          </button>
        </div>
      `).join('');
    }

    // Actions Militants
    function addMilitant(e) {
      e.preventDefault();
      const name = document.getElementById('newMilitantName').value.trim();
      const phone = document.getElementById('newMilitantPhone').value.trim();
      const city = document.getElementById('newMilitantCity').value.trim();

      if (name) {
        militants.push({ id: 'm_' + Date.now(), name, phone, city });
        syncToFirebase();
        document.getElementById('newMilitantName').value = '';
        document.getElementById('newMilitantPhone').value = '';
        document.getElementById('newMilitantCity').value = '';
      }
    }

    function deleteMilitant(id, name) {
      if (materials.some(m => m.holder === name)) {
        alert("Impossible de supprimer ce militant car du matériel lui est actuellement attribué !");
        return;
      }
      militants = militants.filter(m => m.id !== id);
      syncToFirebase();
    }

    function renderMilitantsList() {
      const list = document.getElementById('militantsList');
      list.innerHTML = militants.map(m => `
        <div class="flex justify-between items-center p-2 bg-gray-50 rounded text-sm">
          <div>
            <div class="font-semibold">${m.name}</div>
            <div class="text-xs text-gray-500">${m.phone || 'Pas de tél'} ${m.city ? '• ' + m.city : ''}</div>
          </div>
          ${m.name !== 'Stock Local / Réserve' ? `
            <button onclick="deleteMilitant('${m.id}', '${m.name}')" class="text-red-500 hover:text-red-700">
              <i data-lucide="trash" class="w-4 h-4"></i>
            </button>
          ` : ''}
        </div>
      `).join('');
    }

    // Helpers Modal
    function openModal(id) {
      document.getElementById(id).classList.remove('hidden');
      document.getElementById(id).classList.add('flex');
    }

    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
      document.getElementById(id).classList.remove('flex');
    }

    // Initialisation icons
    lucide.createIcons();
  </script>
</body>
</html>
